plugins {
    id 'library.deps-conventions'
    id 'library.java-conventions'
    id 'library.publishing-conventions'
}

sourceSets {
    src {
        java {
            srcDir "src/main/java"
        }
    }
}

dependencies {
    //eclipse libs
    implementation(libs.eclipse.swt) {
        exclude group: "org.eclipse.platform", module: "org.eclipse.swt"
    }
    implementation(libs.eclipse.ui) {
        exclude group: "org.eclipse.platform", module: "org.eclipse.swt"
    }
    implementation(libs.eclipse.jface) {
        exclude group: "org.eclipse.platform", module: "org.eclipse.swt"
    }
    implementation libs.eclipse.osgi
    implementation libs.eclipse.core.resources
    implementation libs.eclipse.debug.ui
    implementation(libs.eclipse.ui.views) {
        exclude group: "org.eclipse.platform", module: "org.eclipse.swt"
    }
    implementation(libs.eclipse.search) {
        exclude group: "org.eclipse.platform", module: "org.eclipse.swt"
    }

    implementation(libs.hec.monolith)

    implementation(libs.eclipse.debug.core)

    implementation fileTree(dir: 'src/main/resources/jars/', include: ['*.jar'])
}

tasks.register("createBuildPropertiesFile", WriteProperties) { t ->
    destinationFile = layout.buildDirectory.dir("resources/main").map {
        it.file("jdiagram-legacy-build.properties")
    }
    comment = "this file is automatically created at build time, edits will be overwritten"
    property("version", project.version)
    property("gradle.version", gradle.gradleVersion)
    property("build.time", new Date().toString())
}

tasks.named('processResources') {
    dependsOn tasks.named('createBuildPropertiesFile')
}
