plugins {
    id 'maven-publish'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/CentralValleyModeling/jdiagram")
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}

// Guard against publishing an artifact with no version (pass -Pversion=x.y.z).
tasks.withType(PublishToMavenRepository).configureEach {
    doFirst {
        if (project.version == null || project.version.toString() == 'unspecified') {
            throw new GradleException("No version set. Run with -Pversion=<version>, e.g. -Pversion=1.2.0-SNAPSHOT")
        }
    }
}
