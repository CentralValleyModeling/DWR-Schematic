name: Snapshot Release

# Manually triggered: builds the main branch and publishes <version>-SNAPSHOT to GitHub Packages.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Base version to publish (e.g. 1.2.0). "-SNAPSHOT" is appended automatically.'
        required: true
        type: string

permissions:
  contents: read
  packages: write

# Never run two snapshot publishes at the same time.
concurrency:
  group: snapshot-release
  cancel-in-progress: false

jobs:

  snapshot-release:
    runs-on: windows-2022

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Compute snapshot version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          base="${INPUT_VERSION#v}"
          base="${base%-SNAPSHOT}"
          if [[ ! "$base" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Version '$INPUT_VERSION' is not a valid version (expected e.g. 1.2.0)."
            exit 1
          fi
          echo "value=${base}-SNAPSHOT" >> "$GITHUB_OUTPUT"
          echo "Publishing version ${base}-SNAPSHOT from main @ $(git rev-parse --short HEAD)"

      - name: Build with Gradle
        shell: bash
        run: ./gradlew clean build -Pversion=${{ steps.version.outputs.value }}

      - name: Run tests
        shell: bash
        run: ./gradlew test -Pversion=${{ steps.version.outputs.value }}

      - name: Publish snapshot package
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publish -Pversion=${{ steps.version.outputs.value }}

      - name: Summary
        shell: bash
        run: |
          echo "### Published \`${{ steps.version.outputs.value }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Built from \`main\` @ \`$(git rev-parse --short HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
