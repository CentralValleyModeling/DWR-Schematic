name: Java CI

on:
  pull_request:
    types:
      - synchronize
      - opened
      - reopened
  push:
    tags:
      - '*'

jobs:

  build-schematic-lib:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build with Gradle
        shell: bash
        env:
          DEP_TOKEN: ${{ secrets.WRIMS_ENGINE_DEPENDENCIES_TOKEN }}
        run: |
          ./gradlew clean -PcvmUserId="dwr-wrims-build" -PcvmPassword="$DEP_TOKEN"
          ./gradlew build -PcvmUserId="dwr-wrims-build" -PcvmPassword="$DEP_TOKEN"

      - name: Run tests
        shell: bash
        run: |
          ./gradlew test

      - name: Publish package
        shell: bash
        if: startsWith(github.ref, 'refs/tags/')
        env:
          DEP_TOKEN: ${{ secrets.WRIMS_ENGINE_DEPENDENCIES_TOKEN }}
        run: ./gradlew publish -PcvmUserId="dwr-wrims-build" -PcvmPassword="$DEP_TOKEN"