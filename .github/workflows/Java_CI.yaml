name: Java CI

on:
  pull_request:
    types:
      - synchronize
      - opened
      - reopened
  push:
    tags:
      - '*'

jobs:

  build-schematic-lib:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v6

      - name: Verify token access to wrims-engine-dependencies
        env:
          DEP_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          curl --fail -i --header 'authorization: Bearer $DEP_TOKEN' \
            https://maven.pkg.github.com/CentralValleyModeling/wrims-engine-dependencies/com.google.ortools/linearsolver/2013-01-10/linearsolver-2013-01-10.jar

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build with Gradle
        shell: bash
        env:
          DEP_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew clean -PcvmUserId="$DEP_TOKEN" -PcvmPassword="$DEP_TOKEN"
          ./gradlew build -PcvmUserId="$DEP_TOKEN" -PcvmPassword="$DEP_TOKEN"

      - name: Publish package
        shell: bash
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEP_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publish -PcvmUserId="$DEP_TOKEN" -PcvmPassword="$DEP_TOKEN"